# ============================================================
# GitHub Pages deployment for p780bt-web.
#
# The actual static app lives in `printer_web/` — this workflow uploads
# that directory as a Pages artefact and deploys it, so the published
# site at https://<user>.github.io/p780bt-web/ serves `printer_web/index.html`
# as its root.
#
# One-time repo setup (after the first push to main):
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# Every subsequent push to `main` re-deploys automatically.
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploy needs write on `pages` and an ID token for verification;
# `contents: read` is the standard minimum for checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys in parallel; cancel in-flight ones when a new
# commit arrives so the live site reflects the latest `main`.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artefact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the static app; everything else in the repo
          # (README, LICENSE, protocol spec) stays out of the site.
          path: printer_web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
